services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-api
    ports:
      - "8080:8080"
    user: "1001:1001"
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    environment:
      - LOG_LEVEL=info
      - TTS_CONFIG_FILE=/app/config.yaml
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-worker
    command: worker
    user: "1001:1001"
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    environment:
      - LOG_LEVEL=info
      - TTS_CONFIG_FILE=/app/config.yaml
    restart: unless-stopped
    stop_grace_period: 30s
