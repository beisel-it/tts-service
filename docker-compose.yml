services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-api
    ports:
      - "8081:8080"
    user: "1001:1001"
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    environment:
      - TTS_STORAGE__PUBLIC_BASE_URL=http://localhost:8080
      - TTS_API_BASE_URL=http://localhost:8080
      - LOG_LEVEL=info
      - TTS_CONFIG_FILE=/app/config.yaml
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: tts-caddy
    ports:
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ./data/audio:/data/audio:ro
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tts-worker
    command: worker
    user: "1001:1001"
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    environment:
      - TTS_STORAGE__PUBLIC_BASE_URL=http://localhost:8080
      - TTS_API_BASE_URL=http://localhost:8080
      - LOG_LEVEL=info
      - TTS_CONFIG_FILE=/app/config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sqlite3; sqlite3.connect(\"/data/jobs.db\").execute(\"select 1\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
